name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
      version: ${{ steps.release-tag.outputs.version }}
    steps:
      - name: Resolve release tag
        id: release-tag
        run: |
          tag="${{ inputs.tag }}"

          if [[ ! "$tag" =~ ^v0\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to publish tag '$tag'. Expected exact v0.MINOR.PATCH semver."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  release-metadata:
    name: Validate release metadata
    needs: release-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-tag.outputs.tag }}
      - name: Match package versions to release tag
        env:
          RELEASE_VERSION: ${{ needs.release-tag.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          expected = os.environ["RELEASE_VERSION"]
          with Path("pyproject.toml").open("rb") as file:
              root = tomllib.load(file)["project"]
          cli_dependency = next(
              item for item in root["dependencies"] if item.startswith("fensu-cli==")
          ).partition("==")[2]
          manifests = [
              ("root project", root["version"]),
              ("root CLI dependency", cli_dependency),
          ]
          for label, path in [
              ("CLI package", "packages/fensu-cli/pyproject.toml"),
              ("CLI crate", "crates/fensu-cli/Cargo.toml"),
              ("policy crate", "crates/fensu-policy/Cargo.toml"),
              ("checker crate", "crates/fensu-structure-checker/Cargo.toml"),
          ]:
              with Path(path).open("rb") as file:
                  document = tomllib.load(file)
              manifests.append((label, document.get("project", document.get("package"))["version"]))
          mismatches = [f"{label}={version}" for label, version in manifests if version != expected]
          if mismatches:
              raise SystemExit(
                  f"Release tag version {expected} does not match: {', '.join(mismatches)}"
              )
          PY

  wheels:
    name: Build wheel (${{ matrix.platform.name }})
    needs: [release-tag, release-metadata]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64
            interpreter: python3.12
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
            interpreter: python3.12
          - name: macos-x86_64
            runner: macos-latest
            target: x86_64
            interpreter: python3.12
          - name: macos-arm64
            runner: macos-latest
            target: aarch64
            interpreter: python3.12
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64
            interpreter: python
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-tag.outputs.tag }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --features extension-module
          target: ${{ matrix.platform.target }}
          manylinux: auto
      # --interpreter is required for the build itself, not for the wheel tag.
      # maturin reaches pyo3 through the workspace metadata graph, so it demands
      # an interpreter and cannot discover one inside the manylinux containers.
      - name: Build native CLI wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: >-
            --release --out ../../dist
            --interpreter ${{ matrix.platform.interpreter }}
          target: ${{ matrix.platform.target }}
          manylinux: auto
          working-directory: packages/fensu-cli
      # fensu-cli ships one standalone Rust executable and links no libpython,
      # so it must never carry a CPython tag. maturin derives one from the same
      # pyo3 detection above, regardless of --interpreter, so the published tag
      # is corrected explicitly here and asserted before release.
      - name: Retag native CLI wheel as interpreter-agnostic
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/fensu_cli-*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "No fensu-cli wheel was produced."
            exit 1
          fi
          python -m pip install --quiet wheel
          for wheel in "${wheels[@]}"; do
            python -m wheel tags --python-tag py3 --abi-tag none --remove "$wheel"
          done
          bash .github/scripts/assert_cli_wheel_tags.sh dist
      - uses: actions/upload-artifact@v5
        with:
          name: wheel-${{ matrix.platform.name }}
          path: dist

  sdist:
    name: Build sdist
    needs: [release-tag, release-metadata]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-tag.outputs.tag }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Build native CLI sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out ../../dist
          working-directory: packages/fensu-cli
      - uses: actions/upload-artifact@v5
        with:
          name: sdist
          path: dist

  crates-io:
    name: Publish Rust crates
    needs: [release-tag, release-metadata, wheels, sdist]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-tag.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
      - name: Verify shared crate packages
        run: .github/scripts/verify_shared_crate_packages.sh
      - name: Authenticate with crates.io
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish shared crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        run: |
          publish_if_missing() {
            package="$1"
            version="$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg package "${package}" '.packages[] | select(.name == $package) | .version')"
            status="$(curl --retry 3 --silent --show-error --output /dev/null \
              --write-out '%{http_code}' "https://crates.io/api/v1/crates/${package}/${version}")"
            case "${status}" in
              200)
                echo "${package} ${version} is already published"
                ;;
              404)
                cargo publish --locked -p "${package}"
                ;;
              *)
                echo "Could not determine ${package} ${version} publication status: HTTP ${status}" >&2
                exit 1
                ;;
            esac
          }

          publish_if_missing fensu-policy
          publish_if_missing fensu-structure-checker

  pypi:
    name: Publish to PyPI
    needs:
      - release-tag
      - wheels
      - sdist
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-tag.outputs.tag }}
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Assert native CLI wheels are interpreter-agnostic
        shell: bash
        run: bash .github/scripts/assert_cli_wheel_tags.sh dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
