name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Publish created release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          gh workflow run publish.yml --repo "${GITHUB_REPOSITORY}" --ref main \
            -f "tag=${RELEASE_TAG}"

      - name: Resolve release pull request
        id: release_pr
        if: steps.release.outputs.prs_created == 'true'
        env:
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          number="$(jq -r '.[0].number // empty' <<< "${RELEASE_PRS}")"
          branch="$(jq -r '.[0].headBranchName // empty' <<< "${RELEASE_PRS}")"
          if [[ -z "${number}" || -z "${branch}" ]]; then
            echo "Release Please did not return a pull request number and branch" >&2
            exit 1
          fi
          echo "number=${number}" >> "${GITHUB_OUTPUT}"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v5
        if: steps.release.outputs.prs_created == 'true'
        with:
          ref: ${{ steps.release_pr.outputs.branch }}

      - uses: astral-sh/setup-uv@v6
        if: steps.release.outputs.prs_created == 'true'

      - uses: dtolnay/rust-toolchain@master
        if: steps.release.outputs.prs_created == 'true'
        with:
          toolchain: 1.95.0

      - name: Refresh release lockfiles
        if: steps.release.outputs.prs_created == 'true'
        env:
          RELEASE_BRANCH: ${{ steps.release_pr.outputs.branch }}
        run: |
          uv lock
          cargo check --workspace
          if git diff --quiet -- uv.lock Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock Cargo.lock
          git commit -m "chore: refresh release lockfiles"
          git push origin "HEAD:${RELEASE_BRANCH}"

      - name: Run required release checks
        id: release_checks
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ steps.release_pr.outputs.branch }}
          RELEASE_PR: ${{ steps.release_pr.outputs.number }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          remote_head="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/${RELEASE_BRANCH}" \
            --jq .object.sha)"
          if [[ "${remote_head}" != "${head_sha}" ]]; then
            echo "Release pull request moved from ${head_sha} to ${remote_head}" >&2
            exit 1
          fi
          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"
          workflows=(pull-request-metadata.yml version-guard.yml verify.yml)
          metadata_contexts=("Pull Request Metadata")
          version_contexts=("Block automatic 1.0 releases")
          verify_contexts=(
            "verify"
            "rust"
            "Shared crate packages (Rust 1.85)"
            "performance"
            "windows"
            "native-package-smoke (ubuntu-latest)"
            "native-package-smoke (macos-latest)"
            "native-package-smoke (windows-latest)"
            "web-parser-analyzer-smoke (ubuntu-latest)"
            "web-parser-analyzer-smoke (macos-latest)"
            "web-parser-analyzer-smoke (windows-latest)"
            "source-build"
          )
          required_contexts=(
            "${metadata_contexts[@]}"
            "${version_contexts[@]}"
            "${verify_contexts[@]}"
          )
          for context in "${required_contexts[@]}"; do
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${head_sha}" \
              -f state=pending -f "context=${context}" \
              -f description="Trusted release check is running" >/dev/null
          done

          gh workflow run pull-request-metadata.yml --repo "${GITHUB_REPOSITORY}" \
            --ref "${RELEASE_BRANCH}" -f "pr_number=${RELEASE_PR}"
          gh workflow run version-guard.yml --repo "${GITHUB_REPOSITORY}" \
            --ref "${RELEASE_BRANCH}"
          gh workflow run verify.yml --repo "${GITHUB_REPOSITORY}" \
            --ref "${RELEASE_BRANCH}"

          for workflow in "${workflows[@]}"; do
            run_id=""
            for _ in {1..30}; do
              run_id="$(gh run list --repo "${GITHUB_REPOSITORY}" \
                --workflow "${workflow}" --branch "${RELEASE_BRANCH}" \
                --event workflow_dispatch --limit 20 --json databaseId,headSha \
                --jq ".[] | select(.headSha == \"${head_sha}\") | .databaseId" \
                | head -n 1)"
              [[ -n "${run_id}" ]] && break
              sleep 2
            done
            if [[ -z "${run_id}" ]]; then
              case "${workflow}" in
                pull-request-metadata.yml) contexts=("${metadata_contexts[@]}") ;;
                version-guard.yml) contexts=("${version_contexts[@]}") ;;
                verify.yml) contexts=("${verify_contexts[@]}") ;;
              esac
              for context in "${contexts[@]}"; do
                gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${head_sha}" \
                  -f state=failure -f "context=${context}" \
                  -f description="Trusted release check did not start" >/dev/null
              done
              echo "Required workflow ${workflow} did not start for ${head_sha}" >&2
              exit 1
            fi
            run_url="$(gh run view "${run_id}" --repo "${GITHUB_REPOSITORY}" \
              --json url --jq .url)"
            if gh run watch "${run_id}" --repo "${GITHUB_REPOSITORY}" --exit-status; then
              state=success
              description="Trusted release check passed"
            else
              state=failure
              description="Trusted release check failed"
            fi
            case "${workflow}" in
              pull-request-metadata.yml) contexts=("${metadata_contexts[@]}") ;;
              version-guard.yml) contexts=("${version_contexts[@]}") ;;
              verify.yml) contexts=("${verify_contexts[@]}") ;;
            esac
            for context in "${contexts[@]}"; do
              gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${head_sha}" \
                -f "state=${state}" -f "context=${context}" -f "target_url=${run_url}" \
                -f "description=${description}" >/dev/null
            done
            [[ "${state}" == "success" ]] || exit 1
          done

      - name: Merge release pull request and continue release
        if: steps.release.outputs.prs_created == 'true'
        env:
          CHECKED_SHA: ${{ steps.release_checks.outputs.head_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ steps.release_pr.outputs.branch }}
          RELEASE_PR: ${{ steps.release_pr.outputs.number }}
        run: |
          current_head="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/${RELEASE_BRANCH}" \
            --jq .object.sha)"
          if [[ "${current_head}" != "${CHECKED_SHA}" ]]; then
            echo "Release pull request changed after verification" >&2
            exit 1
          fi
          gh pr merge "${RELEASE_PR}" --repo "${GITHUB_REPOSITORY}" --squash \
            --match-head-commit "${CHECKED_SHA}"
          gh workflow run release-please.yml --repo "${GITHUB_REPOSITORY}" --ref main
