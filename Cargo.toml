[workspace]
members = [
    "crates/fensu-cli",
    "crates/fensu-facts",
    "crates/fensu-native",
    "crates/fensu-policy",
    "crates/fensu-svelte",
    "crates/fensu-structure-checker",
    "crates/fensu-typescript",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false
rust-version = "1.95"

[workspace.dependencies]
cap-fs-ext = "4"
cap-std = "4"
command-group = "=5.0.1"
dunce = "1.0"
encoding_rs = "0.8"
flate2 = { version = "1", default-features = false, features = ["zlib"] }
globset = "=0.4.19"
hex = "0.4"
oxc_allocator = "=0.143.0"
oxc_ast = "=0.143.0"
oxc_ast_visit = "=0.143.0"
oxc_diagnostics = "=0.143.0"
oxc_parser = "=0.143.0"
oxc_semantic = "=0.143.0"
oxc_span = "=0.143.0"
oxc_syntax = "=0.143.0"
proc-macro2 = { version = "1", features = ["span-locations"] }
pyo3 = { version = "0.29", features = ["abi3-py312"] }
quote = "1"
rayon = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
fensu-facts = { path = "crates/fensu-facts", default-features = false }
fensu-native = { path = "crates/fensu-native", default-features = false }
fensu-policy = { path = "crates/fensu-policy" }
ruff_python_ast = "=0.0.4"
ruff_python_parser = "=0.0.4"
ruff_text_size = "=0.0.4"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
tempfile = "3"
toml = "0.9"
tree-sitter = "=0.26.6"
tree-sitter-htmlx-svelte = "=0.1.16"
unicode-ident = "1"
unicode-normalization = "0.1"
walkdir = "2"
fensu-typescript = { path = "crates/fensu-typescript" }
fensu-svelte = { path = "crates/fensu-svelte" }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
await_holding_lock = "deny"
