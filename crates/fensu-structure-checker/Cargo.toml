[package]
name = "fensu-structure-checker"
version = "0.14.0" # x-release-please-version
edition.workspace = true
license.workspace = true
publish = true
rust-version = "1.85"
description = "Configurable structural convention checks for Rust workspaces"
repository = "https://github.com/chio-labs/fensu"
readme = "README.md"
keywords = ["architecture", "lint", "workspace"]
categories = ["development-tools"]

[lints]
workspace = true

[dependencies]
cargo_metadata.workspace = true
proc-macro2.workspace = true
quote.workspace = true
serde.workspace = true
syn.workspace = true
toml.workspace = true
walkdir.workspace = true

[lib]
name = "fensu_structure_checker"
path = "src/lib.rs"

[[bin]]
name = "fensu-structure-checker"
path = "src/main.rs"
