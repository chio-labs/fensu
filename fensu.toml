[targets.python]
analyzer = "python"
roots = ["src/fensu"]
tests = ["tests"]
tooling = ["scripts"]
select = ["FF"]

[[targets.python.rule_exceptions]]
rule = "FFS010"
path = "src/fensu/rules/authoring/main/define.py"
symbols = ["rule"]
reason = "The stable public rule decorator exposes one explicit keyword per authoring contract."

[targets.rust]
analyzer = "rust"
roots = ["crates"]
tests = []
tooling = ["crates/fensu-rust"]
rule_packs = ["rust"]
select = ["FPRS"]

[[targets.rust.rule_exceptions]]
rule = "FPRSL105"
path = "crates/fensu-rust/src/rules/main/check_repository_with_config.rs"
reason = "This public library entry is consumed directly by downstream crates and integration tests."

[targets.rust.rule_options.FPRSL102]
packages = ["ruff_python_ast", "ruff_python_parser"]
restricted_paths = ["rules"]
remediation = "consume shared fensu-facts row models instead of parser or AST types"

[targets.rust.rule_options.FPRSL304]
crate_names = [
  "fensu-cli",
  "fensu-facts",
  "fensu-native",
  "fensu-policy",
  "fensu-rust",
  "fensu-svelte",
  "fensu-typescript",
]
