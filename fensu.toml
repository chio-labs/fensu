[targets.python]
analyzer = "python"
roots = ["src/fensu"]
tests = ["tests"]
tooling = ["scripts"]
select = ["FF"]

[targets.rust]
analyzer = "rust"
roots = ["crates"]
tests = []
tooling = ["crates/fensu-rust"]
rule_packs = ["rust"]
select = ["FPRS"]

[targets.rust.rule_options.FPRSL102]
packages = ["ruff_python_ast", "ruff_python_parser"]
restricted_paths = ["rules"]
remediation = "consume shared fensu-facts row models instead of parser or AST types"

[targets.rust.rule_options.FPRSL304]
crate_names = [
  "fensu-cli",
  "fensu-facts",
  "fensu-native",
  "fensu-policy",
  "fensu-rust",
  "fensu-svelte",
  "fensu-typescript",
]
